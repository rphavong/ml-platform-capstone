# Module 7 (revised): tests -> build+push each service's image -> deploy to the live
# EKS cluster -> verify the rollout actually came up healthy. Runs on every push to
# main. The SageMaker endpoints behind these proxies get deliberately torn down
# between sessions for cost (see sagemaker-packaging/*/package_and_deploy.py
# --teardown-only), but the EKS cluster itself stays up, so an automated deploy here
# is safe - it's rolling a new proxy image onto an always-on cluster, not standing
# anything up from scratch.
name: CD - Build, Push, Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: assessment4-robert-cluster

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-and-push:
    name: Build ${{ matrix.service }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: endpoint1-flex
            ecr_repo: assessment4-robert-endpoint1
          - service: endpoint2-xenium
            ecr_repo: assessment4-robert-endpoint2
          - service: endpoint3-spatial
            ecr_repo: assessment4-robert-endpoint3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # This project's IAM user can't create an IAM OIDC identity provider
      # (iam:CreateOpenIDConnectProvider is denied in this class AWS account - the
      # exact same permission wall we hit trying to set up IRSA for the EKS pods in
      # Module 5c). GitHub's own recommended approach for AWS auth is OIDC federation,
      # which needs that same permission to register token.actions.githubusercontent.com
      # as a trusted OIDC provider - so it would hit the identical AccessDenied. Given
      # that constraint, this uses a long-lived IAM access key stored as encrypted
      # GitHub repo secrets instead: less ideal than short-lived OIDC-issued
      # credentials, but it works within the permissions actually available, and is
      # scoped to an IAM user with only ECR push + a narrow, namespace-scoped EKS
      # access entry - not an admin key.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Same exact flags that got these images working locally in Module 6b:
      # SageMaker/standard Docker tooling rejects the OCI-format manifests that
      # buildx produces by default, so --provenance=false --sbom=false and
      # oci-mediatypes=false force the older Docker v2 Schema2 format instead.
      # --output type=docker loads the built image into the runner's local Docker
      # daemon rather than pushing straight from buildx, matching the proven local
      # recipe exactly - then an ordinary `docker push` sends it to ECR.
      - name: Build image
        working-directory: services/${{ matrix.service }}
        env:
          ECR_URI: ${{ steps.ecr-login.outputs.registry }}/${{ matrix.ecr_repo }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false --sbom=false \
            --output type=docker,oci-mediatypes=false \
            -t "$ECR_URI:k8s-proxy" \
            -t "$ECR_URI:${{ github.sha }}" \
            .

      - name: Push image
        env:
          ECR_URI: ${{ steps.ecr-login.outputs.registry }}/${{ matrix.ecr_repo }}
        run: |
          docker push "$ECR_URI:k8s-proxy"
          docker push "$ECR_URI:${{ github.sha }}"

  deploy:
    name: Deploy ${{ matrix.service }}
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false so a problem rolling out endpoint1 doesn't cancel the
      # in-flight rollout of endpoint2/3 - each service's deploy is independent.
      fail-fast: false
      matrix:
        include:
          - service: endpoint1-flex
            ecr_repo: assessment4-robert-endpoint1
            namespace: single-cell-genomics
          - service: endpoint2-xenium
            ecr_repo: assessment4-robert-endpoint2
            namespace: single-cell-genomics
          - service: endpoint3-spatial
            ecr_repo: assessment4-robert-endpoint3
            namespace: spatial-analysis

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Uses the EKS access entry from terraform/github-actions-eks-access.tf -
      # scoped to exactly this service's namespace, nothing wider.
      - name: Point kubectl at the EKS cluster
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Roll out the new image
        env:
          # Account ID via AWS CLI rather than hardcoding it a second time in this
          # file - matches the pattern in terraform/provider.tf (data.aws_caller_identity).
          AWS_ACCOUNT_ID_CMD: aws sts get-caller-identity --query Account --output text
        run: |
          ACCOUNT_ID=$($AWS_ACCOUNT_ID_CMD)
          IMAGE="$ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ matrix.ecr_repo }}:${{ github.sha }}"
          kubectl set image deployment/${{ matrix.service }} \
            ${{ matrix.service }}="$IMAGE" \
            -n ${{ matrix.namespace }}

      # Verification step (rubric 4.3): wait for the rollout to actually finish -
      # this fails the job (and the workflow) if the new pod never reaches Ready,
      # rather than reporting success just because `kubectl set image` was accepted.
      - name: Wait for rollout to complete
        run: |
          kubectl rollout status deployment/${{ matrix.service }} \
            -n ${{ matrix.namespace }} \
            --timeout=120s

      # Second verification step: an actual /health call INSIDE the new pod, not
      # just "the Deployment object says Ready". Uses python's urllib (same as the
      # Dockerfile's own HEALTHCHECK) rather than curl - these images don't have curl
      # installed (see services/*/Dockerfile), which cost real debugging time earlier
      # in this project when a kubectl exec + curl command silently failed.
      - name: Verify the new pod answers /health
        # Resolve the pod through the Deployment at exec-time (`deployment/<name>`,
        # not a pod name captured in an earlier step) - `kubectl exec` looks up a
        # live, running pod itself the moment this runs. Capturing a pod name with
        # a separate `kubectl get pod ... -o jsonpath` command first left a race:
        # rollout status had just finished replacing the old pod, and by the time
        # exec ran a moment later, that pod name had already been torn down
        # ("NotFound") even though the rollout itself succeeded.
        run: |
          echo "Checking /health on deployment/${{ matrix.service }}..."
          kubectl exec -n ${{ matrix.namespace }} deployment/${{ matrix.service }} -- \
            python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/health', timeout=5).read().decode())"
          kubectl get pods -n ${{ matrix.namespace }} -l app=${{ matrix.service }}
