# One ConfigMap, one key per service, holding the SageMaker endpoint name each proxy
# should route to. This is the "explicit routing" from the rubric made visible in the
# manifest itself - anyone reading this file can see exactly which K8s service talks to
# which SageMaker endpoint, without having to open main.py to find the default.
#
# These values match the defaults already baked into each image (os.environ.get(...,
# "assessment4-robert-endpointN-...")), so setting them here isn't strictly required for
# the app to work - but it makes the routing explicit and overridable without a rebuild,
# which is the point of using env vars for this in the first place.
apiVersion: v1
kind: ConfigMap
metadata:
  name: proxy-config
  namespace: ml-platform
data:
  AWS_REGION: "us-east-1"
  ENDPOINT1_SAGEMAKER_ENDPOINT_NAME: "assessment4-robert-endpoint1-flex"
  ENDPOINT2_SAGEMAKER_ENDPOINT_NAME: "assessment4-robert-endpoint2-xenium"
  ENDPOINT3_SAGEMAKER_ENDPOINT_NAME: "assessment4-robert-endpoint3-spatial"
