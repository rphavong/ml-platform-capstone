# Smaller namespace (1 deployment, bigger payloads) - see k8s/05-quota-single-cell-genomics.yaml
# for the same reasoning, sized down accordingly.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: spatial-analysis-quota
  namespace: spatial-analysis
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 512Mi
    limits.cpu: "1"
    limits.memory: 1Gi
    pods: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: spatial-analysis-limits
  namespace: spatial-analysis
spec:
  limits:
    - type: Container
      default:
        cpu: 300m
        memory: 384Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: 500m
        memory: 768Mi
      min:
        cpu: 50m
        memory: 64Mi
