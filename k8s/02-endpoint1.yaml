# endpoint1-flex - lives in single-cell-genomics (see 00-namespaces.yaml for why).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: endpoint1-flex
  namespace: single-cell-genomics
  labels:
    app: endpoint1-flex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: endpoint1-flex
  template:
    metadata:
      labels:
        app: endpoint1-flex
    spec:
      containers:
        - name: endpoint1-flex
          image: 388691194728.dkr.ecr.us-east-1.amazonaws.com/assessment4-robert-endpoint1:k8s-proxy
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: proxy-config
                  key: AWS_REGION
            - name: SAGEMAKER_ENDPOINT_NAME
              valueFrom:
                configMapKeyRef:
                  name: proxy-config
                  key: ENDPOINT1_SAGEMAKER_ENDPOINT_NAME
            # Fallback-only credentials (see pod-fallback-iam.tf + main.py). Named
            # AWS_BACKUP_* on purpose, NOT AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY -
            # those standard names would jump to the FRONT of boto3's default credential
            # chain and silently override the node-role path we actually want as primary.
            - name: AWS_BACKUP_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: sagemaker-invoke-fallback
                  key: access_key_id
            - name: AWS_BACKUP_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: sagemaker-invoke-fallback
                  key: secret_access_key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          # startupProbe: gives the container up to 60s (30 x 2s) to come up before
          # liveness/readiness start counting failures at all - protects a slow first
          # pull/cold start from being mistaken for a crash loop. Once it succeeds once,
          # liveness/readiness take over exactly as before.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: endpoint1-flex
  namespace: single-cell-genomics
spec:
  selector:
    app: endpoint1-flex
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
