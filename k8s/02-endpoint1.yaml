# Module 6c: endpoint1-flex, running as a Kubernetes Deployment + Service.
#
# Deployment = "keep 1 healthy pod of this image running, replace it if it dies."
# Service    = "give that pod a stable internal DNS name (endpoint1-flex.ml-platform)
#               other things in the cluster - like the ops dashboard later - can call,
#               instead of tracking pod IPs that change every restart."
#
# replicas: 1 on purpose for now - this is a demo cluster on 2x t3.medium nodes, and 3
# services x more replicas each would eat the node capacity fast. Bump this once you're
# ready to show HA / rolling updates as part of the demo narrative.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: endpoint1-flex
  namespace: ml-platform
  labels:
    app: endpoint1-flex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: endpoint1-flex
  template:
    metadata:
      labels:
        app: endpoint1-flex
    spec:
      containers:
        - name: endpoint1-flex
          image: 388691194728.dkr.ecr.us-east-1.amazonaws.com/assessment4-robert-endpoint1:k8s-proxy
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: proxy-config
                  key: AWS_REGION
            - name: SAGEMAKER_ENDPOINT_NAME
              valueFrom:
                configMapKeyRef:
                  name: proxy-config
                  key: ENDPOINT1_SAGEMAKER_ENDPOINT_NAME
          # requests = what the scheduler reserves for this pod when deciding which
          # node to place it on. limits = the hard ceiling Kubernetes will enforce
          # (OOMKilled if memory goes over, throttled if CPU goes over). This is a
          # thin proxy with no model in-process anymore, so it needs very little.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          # liveness: "is the process alive at all" - never touches SageMaker, so a
          # slow/unreachable SageMaker endpoint won't cause Kubernetes to kill and
          # restart a perfectly healthy pod.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          # readiness: "is this pod ready to receive traffic" - checks the local
          # schema.json load finished. Also local-only (not a SageMaker round trip),
          # so it reflects startup state, not SageMaker's availability.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: endpoint1-flex
  namespace: ml-platform
spec:
  selector:
    app: endpoint1-flex
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
