# endpoint3-spatial - lives in spatial-analysis, its own namespace/workstream since it's
# served by a separately-trained model (see k8s/00-namespaces.yaml). Slightly more
# memory headroom than the other two - its payloads are bigger (60 cells x 4512
# features in the packaged test data) since it forwards the full expression matrix plus
# x/y coordinates and predicted_label per cell.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: endpoint3-spatial
  namespace: spatial-analysis
  labels:
    app: endpoint3-spatial
spec:
  replicas: 1
  selector:
    matchLabels:
      app: endpoint3-spatial
  template:
    metadata:
      labels:
        app: endpoint3-spatial
    spec:
      containers:
        - name: endpoint3-spatial
          image: 388691194728.dkr.ecr.us-east-1.amazonaws.com/assessment4-robert-endpoint3:k8s-proxy
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: proxy-config
                  key: AWS_REGION
            - name: SAGEMAKER_ENDPOINT_NAME
              valueFrom:
                configMapKeyRef:
                  name: proxy-config
                  key: ENDPOINT3_SAGEMAKER_ENDPOINT_NAME
            - name: AWS_BACKUP_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: sagemaker-invoke-fallback
                  key: access_key_id
            - name: AWS_BACKUP_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: sagemaker-invoke-fallback
                  key: secret_access_key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: endpoint3-spatial
  namespace: spatial-analysis
spec:
  selector:
    app: endpoint3-spatial
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
