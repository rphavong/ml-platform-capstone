# endpoint2-xenium - lives in single-cell-genomics, same as endpoint1-flex (both are
# routed to the SAME reference model - see k8s/00-namespaces.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: endpoint2-xenium
  namespace: single-cell-genomics
  labels:
    app: endpoint2-xenium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: endpoint2-xenium
  template:
    metadata:
      labels:
        app: endpoint2-xenium
    spec:
      containers:
        - name: endpoint2-xenium
          image: 388691194728.dkr.ecr.us-east-1.amazonaws.com/assessment4-robert-endpoint2:k8s-proxy
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: proxy-config
                  key: AWS_REGION
            - name: SAGEMAKER_ENDPOINT_NAME
              valueFrom:
                configMapKeyRef:
                  name: proxy-config
                  key: ENDPOINT2_SAGEMAKER_ENDPOINT_NAME
            - name: AWS_BACKUP_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: sagemaker-invoke-fallback
                  key: access_key_id
            - name: AWS_BACKUP_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: sagemaker-invoke-fallback
                  key: secret_access_key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: endpoint2-xenium
  namespace: single-cell-genomics
spec:
  selector:
    app: endpoint2-xenium
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
